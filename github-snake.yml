# Generates an animated "snake eating your contribution graph" SVG/GIF
# using Platane/snk, then publishes it to the `output` branch so it can be
# embedded straight into README.md via raw.githubusercontent.com.
#
# Setup:
#   1. Save this file as .github/workflows/github-snake.yml in your
#      rameshfront/rameshfront profile repo.
#   2. Make sure the repo has an `output` branch it can push to (the action
#      creates/updates it automatically — you don't need to create it by hand).
#   3. Settings → Actions → General → Workflow permissions → set to
#      "Read and write permissions" so the job can push.

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 2 * * *"   # once a day
  workflow_dispatch:       # allow manual runs from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate a custom-colored snake
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: rameshfront
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake.gif?color_snake=ff3d9a&color_dots=1a0c2b,2b0f42,5b2a86,9b4dff,ff3d9a&color_bg=0c0417

      - name: Push snake output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
