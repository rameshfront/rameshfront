<svg width="920" height="200" viewBox="0 0 920 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub trophies for rameshfront">
  <defs>
    <clipPath id="cardClip"><rect x="0" y="0" width="920" height="200" rx="20"/></clipPath>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0417"/><stop offset="100%" stop-color="#2b0f42"/>
