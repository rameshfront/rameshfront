  <style><![CDATA[
    .mono { font-family:'SFMono-Regular',Consolas,monospace; }
    .cell { opacity:0; animation: popCell .55s cubic-bezier(.2,.8,.3,1.3) forwards; transform-box: fill-box; transform-origin:center; }
    @keyframes popCell { 0%{opacity:0; transform:scale(.5);} 100%{opacity:1; transform:scale(1);} }
    .rankPop { opacity:0; animation: glowIn .5s ease forwards; }
    @keyframes glowIn {
      0% { opacity:0; filter:drop-shadow(0 0 0 transparent); }
      100% { opacity:1; filter:drop-shadow(0 0 6px currentColor); }
    }
    .shine { transform-box: fill-box; animation: sweep 3.2s ease-in-out infinite; }
    @keyframes sweep { 0%{ transform:translateX(0) skewX(-18deg);} 100%{ transform:translateX(260px) skewX(-18deg);} }
  ]]></style>

