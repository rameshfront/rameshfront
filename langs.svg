<svg width="480" height="240" viewBox="0 0 480 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Most used languages for rameshfront">
  <defs>
    <clipPath id="cardClip"><rect x="0" y="0" width="480" height="240" rx="20"/></clipPath>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0417"/><stop offset="100%" stop-color="#2b0f42"/>
    </linearGradient>
    <clipPath id="barClip"><rect x="24" y="46" width="432" height="14" rx="7"/></clipPath>
  </defs>
  <style><![CDATA[
    .mono { font-family:'SFMono-Regular',Consolas,monospace; }
    .titleFade { opacity:0; animation: fadeIn .5s ease forwards; }
    @keyframes fadeIn { to { opacity:1; } }
    .seg { transform-box: fill-box; transform-origin:left center; transform:scaleX(0);
            animation: growSeg .9s cubic-bezier(.2,.7,.3,1) forwards; }
    @keyframes growSeg { to { transform:scaleX(1); } }
    .fadeRow { opacity:0; animation: rowIn .5s ease forwards; }
    @keyframes rowIn { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  ]]></style>

  <g clip-path="url(#cardClip)">
    <rect width="480" height="240" fill="url(#bgGrad)"/>
    <rect x="1" y="1" width="478" height="238" rx="19" fill="none" stroke="#5b2a86"/>
    <text x="24" y="30" class="mono titleFade" font-size="16" font-weight="700" fill="#f7ecff">Most Used Languages</text>

    <g clip-path="url(#barClip)">
      <rect x="24" y="46" width="432" height="14" fill="#1a0c2b"/>
      
      <rect class="seg" style="animation-delay:0.15s" x="24.0" y="46" width="164.2" height="14" fill="#9b4dff"/>
      <rect class="seg" style="animation-delay:0.27s" x="188.2" y="46" width="116.6" height="14" fill="#ffc25c"/>
      <rect class="seg" style="animation-delay:0.39s" x="304.8" y="46" width="77.8" height="14" fill="#ff3d9a"/>
      <rect class="seg" style="animation-delay:0.51s" x="382.6" y="46" width="47.5" height="14" fill="#6a9bff"/>
      <rect class="seg" style="animation-delay:0.63s" x="430.1" y="46" width="25.9" height="14" fill="#ff8ac1"/>
    </g>

    
    <g transform="translate(24,70)">
      <g class="fadeRow" style="animation-delay:0.30s">
        <circle cx="5" cy="-4" r="5" fill="#9b4dff"/>
        <text x="16" y="0" class="mono" font-size="13" fill="#f7ecff">C#</text>
        <text x="150" y="0" text-anchor="end" class="mono" font-size="12" fill="#c9a7e0">38%</text>
      </g>
    </g>
    <g transform="translate(254,70)">
      <g class="fadeRow" style="animation-delay:0.42s">
        <circle cx="5" cy="-4" r="5" fill="#ffc25c"/>
        <text x="16" y="0" class="mono" font-size="13" fill="#f7ecff">JavaScript</text>
        <text x="150" y="0" text-anchor="end" class="mono" font-size="12" fill="#c9a7e0">27%</text>
      </g>
    </g>
    <g transform="translate(24,100)">
      <g class="fadeRow" style="animation-delay:0.54s">
        <circle cx="5" cy="-4" r="5" fill="#ff3d9a"/>
        <text x="16" y="0" class="mono" font-size="13" fill="#f7ecff">PHP</text>
        <text x="150" y="0" text-anchor="end" class="mono" font-size="12" fill="#c9a7e0">18%</text>
      </g>
    </g>
    <g transform="translate(254,100)">
      <g class="fadeRow" style="animation-delay:0.66s">
        <circle cx="5" cy="-4" r="5" fill="#6a9bff"/>
        <text x="16" y="0" class="mono" font-size="13" fill="#f7ecff">TypeScript</text>
        <text x="150" y="0" text-anchor="end" class="mono" font-size="12" fill="#c9a7e0">11%</text>
      </g>
    </g>
    <g transform="translate(24,130)">
      <g class="fadeRow" style="animation-delay:0.78s">
        <circle cx="5" cy="-4" r="5" fill="#ff8ac1"/>
        <text x="16" y="0" class="mono" font-size="13" fill="#f7ecff">HTML/CSS</text>
        <text x="150" y="0" text-anchor="end" class="mono" font-size="12" fill="#c9a7e0">6%</text>
      </g>
    </g>
  </g>
</svg>
